services:
  kiosk:
    build: .
    image: kitchen-inventory-kiosk:latest
    container_name: kitchen-kiosk
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    devices:
      # Brother QL-800 via the usblp kernel driver (PRINTER_BACKEND=linux_kernel)
      - /dev/usb/lp0:/dev/usb/lp0
      # Raw USB bus for PRINTER_BACKEND=pyusb and USB status checks
      - /dev/bus/usb:/dev/bus/usb
    # Allow access to printers that are (re)plugged after the container started
    # (USB major 180 = usblp, 189 = raw USB devices).
    device_cgroup_rules:
      - "c 180:* rmw"
      - "c 189:* rmw"

  # Optional: run Grocy alongside the kiosk. Remove this service if you already
  # have Grocy running elsewhere and point GROCY_URL at it instead.
  # grocy:
  #   image: lscr.io/linuxserver/grocy:latest
  #   container_name: grocy
  #   restart: unless-stopped
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #   volumes:
  #     - ./grocy-config:/config
  #   ports:
  #     - "9283:80"
