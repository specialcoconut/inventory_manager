services:
  kiosk:
    build: .
    image: kitchen-inventory-kiosk:latest
    container_name: kitchen-kiosk
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      # Mount the whole /dev directory, NOT /dev/usb or a single device node:
      # when the printer is power cycled the kernel *deletes* /dev/usb (and the
      # lp* node) and recreates it, so a /dev/usb bind mount goes stale and the
      # container never sees the printer again until a restart. /dev itself is
      # never recreated, so the kiosk always sees the current /dev/usb/lp* and
      # /dev/bus/usb nodes, even after power cycles and replugs.
      - /dev:/dev
    # Device access comes from these cgroup rules, not from `devices:` entries –
    # they are required for the /dev mount above to be usable, and they cover
    # printers power cycled or (re)plugged after the container started.
    # (USB major 180 = usblp, 189 = raw USB devices.)
    device_cgroup_rules:
      - "c 180:* rmw"
      - "c 189:* rmw"

  # Optional: run Grocy alongside the kiosk. Remove this service if you already
  # have Grocy running elsewhere and point GROCY_URL at it instead.
  # grocy:
  #   image: lscr.io/linuxserver/grocy:latest
  #   container_name: grocy
  #   restart: unless-stopped
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #   volumes:
  #     - ./grocy-config:/config
  #   ports:
  #     - "9283:80"
