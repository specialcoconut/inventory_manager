services:
  kiosk:
    build: .
    image: kitchen-inventory-kiosk:latest
    container_name: kitchen-kiosk
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    volumes:
      # Brother QL-800 via the usblp kernel driver (PRINTER_BACKEND=linux_kernel).
      # The whole directory is bind-mounted (not passed via `devices:`) so the
      # kiosk still sees the printer when the kernel renumbers it to
      # /dev/usb/lp1 after a power cycle.
      - /dev/usb:/dev/usb
      # Raw USB bus for PRINTER_BACKEND=pyusb and USB status checks. Also a bind
      # mount: USB devices get a new /dev/bus/usb address on every replug, and
      # `devices:` only snapshots the nodes present at container start.
      - /dev/bus/usb:/dev/bus/usb
    # Device access comes from these cgroup rules, not from `devices:` entries –
    # they are required for the bind mounts above to be usable, and they cover
    # printers (re)plugged after the container started.
    # (USB major 180 = usblp, 189 = raw USB devices.)
    device_cgroup_rules:
      - "c 180:* rmw"
      - "c 189:* rmw"

  # Optional: run Grocy alongside the kiosk. Remove this service if you already
  # have Grocy running elsewhere and point GROCY_URL at it instead.
  # grocy:
  #   image: lscr.io/linuxserver/grocy:latest
  #   container_name: grocy
  #   restart: unless-stopped
  #   environment:
  #     - PUID=1000
  #     - PGID=1000
  #     - TZ=Etc/UTC
  #   volumes:
  #     - ./grocy-config:/config
  #   ports:
  #     - "9283:80"
